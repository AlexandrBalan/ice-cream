    <link rel="stylesheet" href="styles/style.css">
    <title>Ice Cream Shop</title>
</head>
<body>
    <h1>Ice Cream Order Form</h1>
    <h2>Personal Information</h2>



    <form action="">
        <label for="section-labels">Personal Information</label>

        <label for="name">Name:</label>
        <input type="text" name = "" id = "">

        <label for="email">Email:</label>
        <input type="email">

        <label for="section-labels">Order Details</label>



        <label>Choose Your Flavor</label>
        <select name="" id="">
            <option value="vanilla">Vanilla</option>
            <option value="chocolate">Chocolate</option>
            <option value="huckleberry">HuckleBerry</option>
        </select>



        <label for="cone">Choose your cone:</label>
        <label for=""><input type="radio" name = "conetype">Waffle cone</label>
        <label for=""><input type="radio" name = "conetype">Sugar cone</label>
        <label for=""><input type="radio" name = "conetype"> Cup</label>


        <label for="">Toppings:</label>
        <label for=""><input type="checkbox" name = "topping">Sprinkles</label>
        <label for=""><input type="checkbox" name = "topping">Nuts</label>
        <label for=""><input type="checkbox" name = "topping">Cherry</label>
        <label for=""><input type="checkbox" name = "topping">Whipped Cream</label>

        <label for="">Additional comments: </label>
        <textarea name="" id=""> </textarea>


        <button>Submit Order</button>
    </form>
</body>
</html>
